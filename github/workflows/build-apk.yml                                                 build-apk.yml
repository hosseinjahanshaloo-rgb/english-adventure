name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Unpack audio (uploaded as audio.zip)
        run: |
          if [ -f audio.zip ]; then unzip -oq audio.zip; fi
          ls audio | wc -l

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Python packages
        run: pip install buildozer "cython<3"

      - name: Cache buildozer (SDK/NDK/p4a)
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build debug APK
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: english-adventure-apk
          path: bin/*.apk
